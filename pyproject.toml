# Generic template — rename `your-app` / `your_app` to the real project
# name, fill the «...» placeholders, and adjust dependencies to the stack
# you actually need. Distribution name (PyPI) and import name may differ.
[project]
name = "your-app"
version = "0.1.0"
description = "«ONE_LINE_DESCRIPTION»"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "«YOUR NAME»" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy",
  "h5py",
  "jax",
  "dash",
  "plotly",
  "dash-bootstrap-components>=2.0.4",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]"]

[dependency-groups]
dev = ["pytest", "ipykernel"]

[project.urls]
# Fill before the first PyPI release:
# Homepage = "https://github.com/<owner>/<repo>"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/your_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

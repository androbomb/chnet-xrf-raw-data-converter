[project]
name = "raw-xrf-to-h5-opener-python"
version = "0.1.0"
description = "raw MA-XRF (Fi MA-XRF, INFN-CHNet) to NPZ/HDF5 converter: faithful event cube (y, x, channel), energy calibration as attachment, acquisition mask"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy",
  "h5py",
  "tqdm",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xrfraw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests (real data_example files)",
]
addopts = "-m 'not slow'"

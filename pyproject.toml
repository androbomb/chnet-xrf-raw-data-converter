[project]
name = "chnet-xrf-raw-data-converter"
version = "0.1.4"
description = "raw MA-XRF (Fi MA-XRF, INFN-CHNet) to NPZ/HDF5/OME-TIFF/FITS converter: faithful event cube (y, x, channel), energy calibration as attachment, acquisition mask"
readme = "README.en.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alessandro Bombini" }]
keywords = ["xrf", "x-ray-fluorescence", "maxrf", "hdf5", "ome-tiff", "fits", "astropy", "spectroscopy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "h5py",
    "tifffile",
    "tqdm",
]

# UI Dash (example.ipynb) — opzionale: il core di conversione non la richiede
[project.optional-dependencies]
ui = [
    "dash>=4.5",
    "dash-bootstrap-components>=2.0.4",
]
fits = [
    "astropy>=5",
]

[project.scripts]
xrf-raw-to-h5 = "xrfraw.cli:main"

[project.urls]
Homepage = "https://github.com/androbomb/chnet-xrf-raw-data-converter"
Repository = "https://github.com/androbomb/chnet-xrf-raw-data-converter"
Issues = "https://github.com/androbomb/chnet-xrf-raw-data-converter/issues"

[dependency-groups]
dev = [
    "pytest",
    # UI (test + example.ipynb)
    "dash>=4.5",
    "dash-bootstrap-components>=2.0.4",
    # notebook (example.ipynb): kernel Jupyter "xrf-raw"
    "ipykernel",
    "astropy>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xrfraw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests (real data_example files)",
]
addopts = "-m 'not slow'"
